<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f8; padding:40px 16px;">
    <tr>
        <td align="center">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:520px; background:#ffffff; border-radius:12px; overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="padding:28px 32px; text-align:center; border-bottom:1px solid #e5e7eb;">
                        <div style="font-size:24px; font-weight:700; color:#111827;">
                            {{ app_name }}
                        </div>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:36px 32px;">

                        <h1 style="margin:0 0 16px; font-size:24px; line-height:32px; color:#111827;">
                            Verify your email
                        </h1>

                        <p style="margin:0 0 24px; font-size:15px; line-height:24px; color:#4b5563;">
                            Thank you for creating an account with {{ app_name }}.
                            Use the verification code below to complete your registration.
                        </p>

                        <!-- OTP -->
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center"
                                    style="padding:20px; background:#f3f4f6; border-radius:8px;">
                                    <span style="
                                        font-size:32px;
                                        line-height:40px;
                                        font-weight:700;
                                        letter-spacing:8px;
                                        color:#111827;
                                    ">
                                        {{ otp_code }}
                                    </span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:0; font-size:14px; line-height:22px; color:#6b7280;">
                            If you did not request this code, you can safely ignore this email.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:20px 32px; background:#f9fafb; text-align:center;">
                        <p style="margin:0; font-size:12px; line-height:18px; color:#9ca3af;">
                            © {{ year }} {{ app_name }}. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
